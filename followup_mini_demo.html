<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>FollowUp Mini | Project 100K Demo</title><style>:root{font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#192333;background:#f4f7fb}body{margin:0}.wrap{max-width:960px;margin:auto;padding:30px 18px}header{display:flex;justify-content:space-between;gap:12px;align-items:center}.tag{font-size:12px;background:#def5ec;color:#087b53;border-radius:99px;padding:7px 12px}h1{margin:4px 0 0;font-size:27px}.muted{color:#657286;font-size:14px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:23px 0}.card,.panel{background:white;border:1px solid #dfe5ed;border-radius:16px;padding:20px;box-shadow:0 4px 14px #18243b08}.num{font-size:29px;font-weight:750;margin-top:5px}.panel{margin-top:16px}form{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{font-size:13px;font-weight:650;display:block}input,select,textarea{font:inherit;margin-top:6px;padding:11px;border:1px solid #cfd8e3;border-radius:9px;box-sizing:border-box;width:100%;background:white}textarea{resize:vertical;min-height:70px}.span{grid-column:1/-1}button{border:0;background:#146ad1;color:white;padding:10px 15px;border-radius:9px;font-weight:650;cursor:pointer}.secondary{color:#23354e;background:#edf2f8}.danger{color:#af3737;background:#ffeded}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:12px}table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid #e5eaf0;vertical-align:middle}th{color:#536277;font-weight:650}.pill{display:inline-block;font-size:12px;border-radius:99px;padding:4px 9px;background:#e8f2ff;color:#275c9e}.late{background:#ffeded;color:#a63838}.done{background:#e4f7ea;color:#157848}.scroll{overflow-x:auto}footer{font-size:12px;color:#64748b;margin-top:18px}@media(max-width:640px){.cards{grid-template-columns:1fr 1fr}.card{padding:14px}form{grid-template-columns:1fr}.span{grid-column:auto}th,td{white-space:nowrap}}</style></head><body><div class="wrap"><header><div><div class="muted">PROJECT 100K · 시연용</div><h1>FollowUp Mini</h1><div class="muted">고객 문의를 한눈에 관리하세요</div></div><span class="tag">로컬 브라우저 데모</span></header><section class="cards"><div class="card"><div class="muted">전체 문의</div><div class="num" id="total">0</div></div><div class="card"><div class="muted">연락 예정·기한 지남</div><div class="num" id="pending">0</div></div><div class="card"><div class="muted">상담 완료</div><div class="num" id="complete">0</div></div></section><section class="panel"><h2 style="font-size:18px;margin-top:0">새 문의 등록</h2><form id="leadForm"><label>고객 식별명<input id="name" required maxlength="80" placeholder="예: 홍길동 / 문의 A"></label><label>문의 경로<select id="channel"><option>전화</option><option>문자</option><option>카카오톡</option><option>인스타그램</option><option>기타</option></select></label><label>다음 연락 예정일<input id="due" type="date" required></label><label>진행 상태<select id="status"><option>새 문의</option><option>연락 예정</option><option>상담 완료</option><option>보류</option></select></label><label class="span">상담 메모<textarea id="note" maxlength="500" placeholder="개인정보는 최소한으로 기록하세요"></textarea></label><div class="span"><button type="submit">문의 추가</button></div></form></section><section class="panel"><h2 style="font-size:18px;margin-top:0">문의 목록</h2><div class="actions"><button class="secondary" id="sample">가상 샘플 넣기</button><button class="secondary" id="export">CSV 내보내기</button><button class="danger" id="clear">전체 삭제</button></div><div class="scroll"><table><thead><tr><th>고객</th><th>경로</th><th>연락일</th><th>상태</th><th>메모</th><th>관리</th></tr></thead><tbody id="body"></tbody></table></div></section><footer>이 데모는 서버 전송 없이 이 브라우저의 로컬 저장 공간(localStorage)에 데이터를 보관합니다. 실제 고객 개인정보는 입력하지 마세요. 자동 문자·카카오톡 발송 기능은 포함되어 있지 않습니다. 브라우저 데이터 삭제 시 기록이 사라질 수 있습니다.</footer></div><script>const KEY='p100k_followup_mini_v1';let leads=[];try{leads=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{};if(!Array.isArray(leads))leads=[];const el=id=>document.getElementById(id),today=()=>new Date().toLocaleDateString('en-CA');el('due').value=today();const save=()=>localStorage.setItem(KEY,JSON.stringify(leads));function render(){el('total').textContent=leads.length;el('pending').textContent=leads.filter(x=>x.status!=='상담 완료'&&x.due<=today()).length;el('complete').textContent=leads.filter(x=>x.status==='상담 완료').length;const tbody=el('body');tbody.replaceChildren();if(!leads.length){const tr=tbody.insertRow();const td=tr.insertCell();td.colSpan=6;td.textContent='등록된 문의가 없습니다. 가상 샘플을 넣어 기능을 확인해 보세요.';td.className='muted';return}for(const x of leads){const tr=tbody.insertRow();for(const field of ['name','channel','due'])tr.insertCell().textContent=x[field];const statusCell=tr.insertCell(),p=document.createElement('span');p.textContent=x.status;p.className='pill'+(x.status==='상담 완료'?' done':x.due<today()?' late':'');statusCell.append(p);tr.insertCell().textContent=x.note||'-';const controls=tr.insertCell();const b=document.createElement('button');b.className='secondary';b.textContent=x.status==='상담 완료'?'다시 열기':'완료';b.onclick=()=>{x.status=x.status==='상담 완료'?'연락 예정':'상담 완료';save();render()};controls.append(b)}}el('leadForm').onsubmit=e=>{e.preventDefault();leads.unshift({id:Date.now()+Math.random(),name:el('name').value.trim(),channel:el('channel').value,due:el('due').value,status:el('status').value,note:el('note').value.trim()});save();render();el('leadForm').reset();el('due').value=today()};el('sample').onclick=()=>{if(leads.length&&!confirm('기존 목록에 샘플을 추가할까요?'))return;const d=new Date();const date=n=>{const a=new Date(d);a.setDate(a.getDate()+n);return a.toLocaleDateString('en-CA')};leads.unshift({id:Date.now()+1,name:'샘플 고객 A',channel:'전화',due:date(-1),status:'연락 예정',note:'레슨 시간 문의'}, {id:Date.now()+2,name:'샘플 고객 B',channel:'인스타그램',due:date(2),status:'새 문의',note:'수강료 문의'}, {id:Date.now()+3,name:'샘플 고객 C',channel:'문자',due:date(0),status:'상담 완료',note:'상담 완료'});save();render()};el('clear').onclick=()=>{if(confirm('모든 문의 데이터를 삭제할까요?')){leads=[];save();render()}};el('export').onclick=()=>{const fields=['name','channel','due','status','note'];const csv=[['고객','경로','연락일','상태','메모'],...leads.map(x=>fields.map(k=>x[k]||''))].map(row=>row.map(v=>'"'+String(v).replace(/^[=+@\-\t\r]/,'\x27$&').replace(/"/g,'""')+'"').join(',')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'}));a.download='followup-mini.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};render();</script></body></html>
